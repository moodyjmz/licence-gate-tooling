name: Auto-fix
on:
  issue_comment:
    types: [created]
# The action posts a patch as a comment; it never pushes. `contents: write` used to
# be here and is deliberately gone: a bot push to the pull request branch makes the
# bot the last pusher, which hands a self-approval to whoever pushed before it and
# dismisses reviews already given. Do not put it back.
permissions:
  contents: read
  pull-requests: write
jobs:
  fix:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/auto-fix')
    runs-on: ubuntu-latest
    concurrency:
      group: autofix-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # No checkout here: the action checks out the pull request branch itself, after
      # it has decided the commenter is allowed to make it do that.
      - uses: moodyjmz/licence-gate-tooling/actions/auto-fix@PIN
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
