name: Apply licence headers
on:
  issue_comment:
    types: [created]
# The action posts a patch as a comment; it never pushes. `contents: write` used to
# be here and is deliberately gone: a bot push to the pull request branch makes the
# bot the last pusher, which hands a self-approval to whoever pushed before it and
# dismisses reviews already given. Do not put it back.
permissions:
  contents: read
  pull-requests: write
jobs:
  apply:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/std-licence')
    runs-on: ubuntu-latest
    concurrency:
      group: stdlicence-${{ github.event.issue.number }}
    steps:
      - uses: moodyjmz/licence-gate-tooling/actions/std-licence@PIN
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
