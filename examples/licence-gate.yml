# Thin caller. Trigger, permissions, checkout, pinned uses. Nothing else belongs here -
# anything added below becomes editable by the pull requests this gate judges.
name: Licence gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: moodyjmz/licence-gate-tooling/actions/gate@PIN
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          author: ${{ github.event.pull_request.user.login }}
