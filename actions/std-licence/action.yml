name: Apply standard licence headers
description: >-
  Apply a licence header to new files on a reviewer's explicit assertion of
  authorship. The licence follows from the path; the copyright does not.

# The command means "we wrote these", which is an assertion no machine can make.
# This action records the claim, attributes it to the person who made it, and derives
# only the *licence* - which is a function of where the file sits in the tree.
#
# It refuses anything it cannot determine. Refusal is a first-class outcome here: a
# wrong header looks settled, so nobody ever re-examines it.

inputs:
  token:
    description: Token that can read the repository and comment on the pull request.
    required: true

runs:
  using: composite
  steps:
    - name: Authorise and extract the asserted paths
      id: ctx
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs');
          const {owner, repo} = context.repo;
          const who = context.payload.comment.user.login;
          let perm = 'none';
          try {
            const r = await github.rest.repos.getCollaboratorPermissionLevel(
              {owner, repo, username: who});
            perm = r.data.permission;
          } catch (e) { perm = 'none'; }
          if (!['admin','write','maintain'].includes(perm)) {
            // Silence is the answer. See actions/auto-fix: a reply tells a prober the
            // command exists and that permission was the only obstacle. Recorded where
            // only people with repository access can see it.
            core.warning(
              `IGNORED /std-licence from ${who} (permission: ${perm}) on #${context.issue.number}`);
            await core.summary
              .addHeading('Ignored an unauthorised command', 3)
              .addTable([
                [{data: 'Command', header: true}, {data: 'Commenter', header: true},
                 {data: 'Permission', header: true}, {data: 'Pull request', header: true}],
                ['/std-licence', who, perm || 'none', `#${context.issue.number}`],
              ])
              .write();
            core.setOutput('ok', 'false');
            return;
          }
          // Comment text is data, never shell input. Paths go to a file.
          const body = context.payload.comment.body || '';
          const line = body.split('\n').find(l => l.includes('/std-licence')) || '';
          const paths = line.replace('/std-licence','').trim().split(/\s+/).filter(Boolean);
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP || '/tmp'}/explicit-paths.txt`,
            paths.join('\n'));
          const pr = await github.rest.pulls.get(
            {owner, repo, pull_number: context.issue.number});
          core.setOutput('ok',
            String(pr.data.head.repo.full_name === `${owner}/${repo}`));
          core.setOutput('ref', pr.data.head.ref);
          core.setOutput('base_sha', pr.data.base.sha);
          // The commit the command was issued against. Checking out the BRANCH would
          // fetch whatever is at its tip when this step runs, seconds later - so an
          // author can push new content between the reviewer's comment and the
          // checkout, and have it stamped under a judgement made about something
          // else. Pin to the commit; the patch that gets posted is then a patch
          // against the tree the assertion was actually made about.
          core.setOutput('head_sha', pr.data.head.sha);
          if (pr.data.head.repo.full_name !== `${owner}/${repo}`) {
            core.setFailed('Fork pull requests are out of scope for this command. The restriction predates the patch comment and is retained unreviewed.');
          }

    - name: Check out the commit the command was issued against
      if: steps.ctx.outputs.ok == 'true'
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.ctx.outputs.head_sha }}
        fetch-depth: 0
        token: ${{ inputs.token }}

    - name: Refuse if the branch moved after the command
      if: steps.ctx.outputs.ok == 'true'
      shell: bash
      env:
        HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
        REF: ${{ steps.ctx.outputs.ref }}
      run: |
        remote="$(git ls-remote origin "refs/heads/${REF}" | cut -f1)"
        if [ "$remote" != "$HEAD_SHA" ]; then
          echo "Branch moved from ${HEAD_SHA} to ${remote} after the command was issued."
          echo "Refusing: this command asserts authorship over a tree that is no longer there."
          exit 1
        fi

    - name: Apply
      if: steps.ctx.outputs.ok == 'true'
      shell: bash
      env:
        BASE_SHA: ${{ steps.ctx.outputs.base_sha }}
      run: |
        tmp="${RUNNER_TEMP:-/tmp}"
        report="${tmp}/report.md"
        asserted_paths="${tmp}/explicit-paths.txt"
        # The asserted paths reach the script as argv, read from the file the step
        # above wrote. Comment text still never becomes shell input: each line is read
        # whole and passed quoted, so no word splitting, globbing or expansion happens
        # to it on the way.
        if [ ! -f "$asserted_paths" ]; then
          echo "The asserted paths were never written, so the step before this one did" >&2
          echo "not complete. Refusing: a command that asserts authorship over nothing" >&2
          echo "is not the same as one that found nothing to do." >&2
          exit 1
        fi
        paths=()
        while IFS= read -r asserted; do
          if [ -n "$asserted" ]; then paths+=("$asserted"); fi
        done < "$asserted_paths"
        python3 "${GITHUB_ACTION_PATH}/../../scripts/apply-std-licence.py" \
          "$BASE_SHA" HEAD ${paths[@]+"${paths[@]}"} > "$report"
        cat "$report"

    # NOTHING IS PUSHED. The headers are posted as a patch for the author to apply.
    #
    # This action used to commit and push to the pull request branch as
    # github-actions[bot], and carried a commit trailer whose only job was to name
    # the person the bot commit was made on behalf of. Both are gone. A bot push
    # makes the bot the last pusher, which is exactly what
    # require_last_push_approval is there to prevent: whoever pushed to
    # the branch a moment earlier may then approve their own commit, and the record
    # says "approved by them", truthfully and uselessly. The push also moves the
    # head, dismissing reviews already given.
    #
    # The assertion is still recorded and still attributed - in the comment below,
    # to the person who made it. That was always the part worth keeping; labelling a
    # bot commit was not.
    - name: Build the patch comment
      if: steps.ctx.outputs.ok == 'true'
      shell: bash
      run: |
        set -euo pipefail
        tmp="${RUNNER_TEMP:-/tmp}"
        body="${tmp}/comment-body.md"
        patch="${tmp}/std-licence.patch"
        cp "${tmp}/report.md" "$body"
        git diff > "$patch"
        files="$(git diff --name-only)"
        # The report states what was stamped; the diff is the evidence. A report
        # claiming headers with no diff behind it is a contradiction, not a quiet
        # "nothing to do", and the two must never leave by the same exit.
        if grep -q '^Applied a header to' "$body" && [ ! -s "$patch" ]; then
          echo "The report claims headers were applied, but the tree is unchanged." >&2
          exit 1
        fi
        if [ -s "$patch" ] && ! grep -q '^Applied a header to' "$body"; then
          echo "The tree changed, but the report claims nothing was applied." >&2
          exit 1
        fi
        if [ -s "$patch" ]; then
          {
            echo
            echo "**Nothing has been pushed. This is a patch for you to apply yourself.**"
            echo
            echo "Files changed:"
            echo
            printf '%s\n' "$files" | sed 's|^|- `|; s|$|`|'
            echo
          } >> "$body"
          # A comment body is capped at 65536 characters, and a patch truncated at
          # the cap still applies cleanly up to the cut - a partial stamping that
          # looks complete. Say it is too large instead.
          if [ "$(wc -c < "$patch")" -gt 60000 ]; then
            {
              echo "The patch is too large to post here. Add the headers listed in the"
              echo "report above by hand."
            } >> "$body"
          else
            {
              echo "Save the block below as \`std-licence.patch\`, then run"
              echo "\`git apply std-licence.patch\`, commit, and push to this branch."
              echo
              echo '```diff'
              cat "$patch"
              echo '```'
            } >> "$body"
          fi
          {
            echo
            echo "This workflow does not push. A push from it would make the bot the"
            echo "last pusher on your branch, which lets whoever pushed here last"
            echo "approve their own commit, and moving the head dismisses reviews you"
            echo "have already been given. Applying it yourself keeps both intact."
          } >> "$body"
        fi

    - name: Report
      if: steps.ctx.outputs.ok == 'true'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs');
          const {owner, repo} = context.repo;
          const who = context.payload.comment.user.login;
          const path = `${process.env.RUNNER_TEMP || '/tmp'}/comment-body.md`;
          if (!fs.existsSync(path)) {
            // The previous step did not complete. An assertion of authorship recorded
            // against nothing is worse than no record at all.
            core.setFailed('std-licence did not complete; nothing was recorded');
            return;
          }
          await github.rest.issues.createComment({owner, repo,
            issue_number: context.issue.number,
            body: `**Authorship asserted by @${who}.**\n\n${fs.readFileSync(path, 'utf8')}`});
