name: Acknowledgement gate
description: >-
  Require a reviewer - not the author - to record a disposition for every candidate
  replacement event, against the current head commit.

# This gate does not evaluate the compliance judgement. It cannot: whether a changed
# asset is a "replacement" needing a register entry is exactly the question a machine
# should not answer. What it does is record, verifiably, that a reviewer made the
# judgement, which commit they made it against, and that they covered every candidate.
#
# See actions/gate/action.yml for why this lives here rather than in the repository
# being gated. It applies with more force to this one: this action holds
# `statuses: write`, and when the candidate list came from a script the pull request
# could edit, a pull request could simply report no candidates and mark itself green.

inputs:
  token:
    description: Token used to read comments and write the commit status.
    required: true
  register-prefix:
    description: >-
      The line prefix a reviewer's disposition comment must start with. A comment not
      matching this is not a disposition and is ignored entirely.
    required: false
    default: 'example-log:'
  status-context:
    description: Name of the commit status this action writes.
    required: false
    default: 'acknowledgement-gate'

runs:
  using: composite
  steps:
    - name: Resolve the pull request
      id: ctx
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const {owner, repo} = context.repo;
          const number = context.eventName === 'pull_request'
            ? context.payload.pull_request.number
            : context.payload.issue.number;
          const pr = await github.rest.pulls.get({owner, repo, pull_number: number});
          core.setOutput('number', String(number));
          core.setOutput('head_sha', pr.data.head.sha);
          core.setOutput('base_sha', pr.data.base.sha);
          core.setOutput('author', pr.data.user.login);

    - name: Compute candidates
      id: cands
      shell: bash
      env:
        BASE_SHA: ${{ steps.ctx.outputs.base_sha }}
        HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
      run: |
        # No `|| true`. That swallowed the exit code, and the only thing then
        # standing between a gate that could not run and a green "No replacement
        # candidates detected" was an accident: the failure block went to stdout and
        # became garbage candidate paths, so the gate failed closed with a nonsense
        # message. Any later tidy-up that routed errors to stderr, or parsed the file
        # more carefully, would have turned that accident into a false all-clear on a
        # pull request nothing had examined.
        set +e
        tmp="${RUNNER_TEMP:-/tmp}"
        python3 "${GITHUB_ACTION_PATH}/../../scripts/licence-gate.py" --candidates \
          "$BASE_SHA" "$HEAD_SHA" > "${tmp}/candidates.txt" 2> "${tmp}/candidates.err"
        rc=$?
        cat "${tmp}/candidates.txt"
        cat "${tmp}/candidates.err" >&2
        if [ "$rc" != "0" ]; then
          echo "could-not-run=true" >> "$GITHUB_OUTPUT"
        fi
        exit 0

    - name: Verify the acknowledgement
      uses: actions/github-script@v7
      env:
        PR_NUMBER: ${{ steps.ctx.outputs.number }}
        HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
        PR_AUTHOR: ${{ steps.ctx.outputs.author }}
        REGISTER_PREFIX: ${{ inputs.register-prefix }}
        STATUS_CONTEXT: ${{ inputs.status-context }}
        COULD_NOT_RUN: ${{ steps.cands.outputs.could-not-run }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs');
          const {owner, repo} = context.repo;
          const number = Number(process.env.PR_NUMBER);
          const headSha = process.env.HEAD_SHA;
          const author  = process.env.PR_AUTHOR;
          const statusContext = process.env.STATUS_CONTEXT;

          // The prefix is configuration, not a pattern - escape it before it becomes
          // one, or a consumer's punctuation silently changes what matches.
          const prefix = process.env.REGISTER_PREFIX
            .replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const shapeRe = new RegExp(`^\\s*${prefix}`, 'mi');

          const candidates = fs
            .readFileSync(`${process.env.RUNNER_TEMP || '/tmp'}/candidates.txt`, 'utf8')
            .split('\n').map(s => s.trim()).filter(Boolean);

          const setStatus = async (state, description) => {
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: headSha, state,
              context: statusContext,
              description: description.substring(0, 138),
            });
            core.info(`${state}: ${description}`);
            if (state === 'failure') core.setFailed(description);
          };

          // An empty candidate list means "nothing to disposition" ONLY when the gate
          // actually ran. If it did not, the list is empty for the wrong reason, and
          // "No replacement candidates detected" would mark a pull request clean that
          // nothing had examined. Checked before the emptiness test, not after.
          if (process.env.COULD_NOT_RUN === 'true') {
            await setStatus('failure',
              'The licence gate could not run, so candidates are unknown. See the run log.');
            return;
          }

          if (candidates.length === 0) {
            await setStatus('success', 'No replacement candidates detected.');
            return;
          }

          // Comment bodies are attacker-controlled. They are only ever read as data
          // here - never interpolated into a shell - and authorisation is checked
          // against the collaborator permission API, never author_association, which
          // reports organisation membership rather than access to this repository.
          const comments = await github.paginate(github.rest.issues.listComments,
            {owner, repo, issue_number: number, per_page: 100});

          const shaped = comments.filter(c => shapeRe.test(c.body || ''));

          // Eligibility is decided BEFORE selection, and this ordering is the whole
          // point. Taking the newest correctly-shaped comment and then testing whether
          // its author was allowed hands anyone who can comment a veto: post one line
          // of the register prefix on a pull request that already carries a valid
          // disposition and the gate fails for ever, because the only comment it will
          // ever look at is theirs. Filter first, select second, and an ineligible
          // comment is inert rather than obstructive.
          const eligible = [];
          const ignored = [];
          for (const c of shaped) {
            const login = c.user.login;
            if (login === author) {
              // Not an attack - the author acting in good faith. Distinguished from a
              // stranger below so the reported reason stays useful to them.
              ignored.push({login, why: 'is the pull request author'});
              continue;
            }
            let perm = 'none';
            try {
              const r = await github.rest.repos.getCollaboratorPermissionLevel(
                {owner, repo, username: login});
              perm = r.data.permission;
            } catch (e) { perm = 'none'; }
            if (!['admin', 'write', 'maintain'].includes(perm)) {
              core.warning(
                `IGNORED disposition from ${login} (permission: ${perm}) on #${number}`);
              ignored.push({login, why: `lacks write access (${perm})`});
              continue;
            }
            eligible.push(c);
          }

          if (eligible.length === 0) {
            // The reason is only ever reported for the author's own attempt. For a
            // stranger the status stays exactly as it was before they commented -
            // they learn nothing, and they have changed nothing.
            const byAuthor = ignored.find(i => i.login === author);
            await setStatus(byAuthor ? 'failure' : 'pending',
              byAuthor
                ? `Disposition must come from a reviewer, not the pull request author (${author}).`
                : `${candidates.length} candidate(s) await a reviewer disposition.`);
            return;
          }

          const ack = eligible[eligible.length - 1];
          const who = ack.user.login;

          // Staleness. A disposition must name the commit it was made against, and
          // that commit must be the current head.
          //
          // This replaced a timestamp comparison - was the comment created before the
          // head commit's date - which compared against the commit's COMMITTER DATE.
          // That field is set by whoever makes the commit (`GIT_COMMITTER_DATE`), so
          // an author could backdate a push and make a disposition given against an
          // earlier tree look current. Naming the commit removes the clock from the
          // question entirely: the reviewer signs for a specific tree, and a new push
          // produces a different SHA that no existing comment names.
          //
          // The gate prints this line pre-filled in the template it asks the reviewer
          // to copy, so it costs them nothing.
          const shortSha = headSha.substring(0, 9);
          if (!ack.body.includes(shortSha) && !ack.body.includes(headSha)) {
            await setStatus('failure',
              `Disposition does not name the current head ${shortSha}; re-confirm against it.`);
            return;
          }

          // Each candidate needs an ANSWER, not a mention.
          //
          // This tested `body.includes(path)` - whether the path appeared anywhere in
          // the comment. The gate prints a pre-filled template for the reviewer to
          // copy, listing every candidate followed by a bare `-> `. Copying that
          // template and posting it without filling anything in satisfied the prefix
          // check, the commit check, and this one: every path was present, blank arrow
          // and all. The gate then reported "N candidate(s) dispositioned by X" for a
          // reviewer who had asserted nothing. That is not an adversary; that is the
          // ordinary way a person interacts with a template, and the mechanism whose
          // entire purpose is recording that a human looked would have recorded it
          // for a human who did not.
          const body = ack.body;
          const missing = candidates.filter(p => {
            const escaped = p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return !new RegExp(`^\\s*${escaped}\\s*->\\s*\\S`, 'm').test(body);
          });
          if (missing.length) {
            await setStatus('failure',
              `No disposition given for: ${missing.join(', ')}`);
            return;
          }

          await setStatus('success',
            `${candidates.length} candidate(s) dispositioned by ${who}.`);
