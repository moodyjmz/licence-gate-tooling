name: Auto-fix modification notices
description: >-
  Apply the modification notice to modified files that carry a licence header and
  lack one. Mechanical only; never touches new files.

# Anyone with write access may trigger this, the author included. That is the
# difference between this and a disposition: the notice is a fixed string applied to
# a determinable set of files, so it carries no judgement and needs no independent
# signatory.
#
# It deliberately does NOT stamp new files. A modified file always needs the same
# notice. A new file needs a copyright *holder*, which depends on where the content
# came from - and no diff can tell you that. Guessing is how someone else's icon set
# ends up carrying your copyright.

inputs:
  token:
    description: Token that can read the repository and comment on the pull request.
    required: true

runs:
  using: composite
  steps:
    - name: Check the commenter may do this
      id: auth
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const {owner, repo} = context.repo;
          const who = context.payload.comment.user.login;
          // author_association reports organisation membership, not access to this
          // repository. Authorise against the collaborator permission API instead.
          let perm = 'none';
          try {
            const r = await github.rest.repos.getCollaboratorPermissionLevel(
              {owner, repo, username: who});
            perm = r.data.permission;
          } catch (e) { perm = 'none'; }
          if (!['admin', 'write', 'maintain'].includes(perm)) {
            // Ignored in silence. Replying would confirm to someone probing that the
            // command exists and that permission was the only thing in the way; the
            // useful answer to an unauthorised caller is no answer at all. The refusal
            // is still recorded - in the log and the run summary, both of which only
            // people with repository access can read.
            core.warning(
              `IGNORED /auto-fix from ${who} (permission: ${perm}) on #${context.issue.number}`);
            await core.summary
              .addHeading('Ignored an unauthorised command', 3)
              .addTable([
                [{data: 'Command', header: true}, {data: 'Commenter', header: true},
                 {data: 'Permission', header: true}, {data: 'Pull request', header: true}],
                ['/auto-fix', who, perm || 'none', `#${context.issue.number}`],
              ])
              .write();
            core.setOutput('ok', 'false');
            return;
          }
          const pr = await github.rest.pulls.get(
            {owner, repo, pull_number: context.issue.number});
          core.setOutput('ok',
            String(pr.data.head.repo.full_name === `${owner}/${repo}`));
          core.setOutput('ref', pr.data.head.ref);
          core.setOutput('base_sha', pr.data.base.sha);
          // The commit the command was issued against. Checking out the BRANCH would
          // fetch whatever is at its tip when this step runs, seconds later - so an
          // author can push new content between the reviewer's comment and the
          // checkout, and have it stamped under a judgement made about something
          // else. Pin to the commit; the patch that gets posted is then a patch
          // against the tree the commenter actually asked about.
          core.setOutput('head_sha', pr.data.head.sha);
          if (pr.data.head.repo.full_name !== `${owner}/${repo}`) {
            core.setFailed('Fork pull requests are out of scope for this command. The restriction predates the patch comment and is retained unreviewed.');
          }

    - name: Check out the commit the command was issued against
      if: steps.auth.outputs.ok == 'true'
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.auth.outputs.head_sha }}
        fetch-depth: 0
        token: ${{ inputs.token }}
        # The token is used for the fetch and is not written into the checkout's
        # config afterwards. Persisted, it stays available to every later step in the
        # job, and the tree those steps run over came from a pull request.
        persist-credentials: false

    - name: Refuse if the branch moved after the command
      if: steps.auth.outputs.ok == 'true'
      shell: bash
      env:
        HEAD_SHA: ${{ steps.auth.outputs.head_sha }}
        REF: ${{ steps.auth.outputs.ref }}
      run: |
        set -uo pipefail
        # Three answers, three outcomes. Unchecked, a call that FAILED left the answer
        # empty, and an empty answer compares unequal to the head commit - so a remote
        # that could not be reached was reported as "moved from <sha> to ", which tells
        # the reader a specific untrue thing about their branch.
        if ! remote="$(git ls-remote origin "refs/heads/${REF}" | cut -f1)"; then
          echo "Could not ask the remote where ${REF} points." >&2
          echo "Refusing: that the branch did not move is not something this step can" >&2
          echo "conclude from a question it never got an answer to." >&2
          exit 1
        fi
        if [ -z "$remote" ]; then
          echo "${REF} is no longer on the remote." >&2
          echo "Refusing: there is nothing left to apply this fix against." >&2
          exit 1
        fi
        if [ "$remote" != "$HEAD_SHA" ]; then
          echo "Branch moved from ${HEAD_SHA} to ${remote} after the command was issued."
          echo "Refusing: the fix would land on a tree nobody asked about."
          exit 1
        fi

    - name: Apply the fix
      if: steps.auth.outputs.ok == 'true'
      id: fix
      shell: bash
      env:
        BASE_SHA: ${{ steps.auth.outputs.base_sha }}
      run: |
        set +e
        tmp="${RUNNER_TEMP:-/tmp}"
        python3 "${GITHUB_ACTION_PATH}/../../scripts/licence-gate.py" --fix \
          "$BASE_SHA" HEAD > "${tmp}/fixed.txt" 2> "${tmp}/unfixable.txt"
        rc=$?
        cat "${tmp}/fixed.txt"
        cat "${tmp}/unfixable.txt" >&2
        # Exit 3 means some file could not be fixed. Reporting "nothing to auto-fix"
        # about a file the gate is actively blocking on is the failure to avoid here.
        if [ "$rc" != "0" ] && [ "$rc" != "3" ]; then exit "$rc"; fi
        echo "count=$(wc -l < "${tmp}/fixed.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"
        echo "unfixable=$(wc -l < "${tmp}/unfixable.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"

    # NOTHING IS PUSHED. The patch is posted for the author to apply.
    #
    # This action used to commit the fix and push it to the pull request branch as
    # github-actions[bot]. Branch protection's require_last_push_approval exists so
    # that whoever pushed last cannot also approve; a bot push in between gives that
    # away. Someone with write access pushes a commit to another person's pull
    # request, comments /auto-fix, and the bot's push makes the bot the last pusher -
    # so that person may now approve their own commit, and the compliance record
    # reads "approved by them at that sha", which is true and worth nothing. The same
    # push moves the head, so under dismiss_stale_reviews it destroys the approvals
    # this tooling has just finished collecting.
    #
    # The author applying the patch is an ordinary push by an ordinary contributor,
    # and every protection rule then judges it as designed.
    - name: Build the patch comment
      if: steps.auth.outputs.ok == 'true'
      shell: bash
      env:
        COUNT: ${{ steps.fix.outputs.count }}
        UNFIXABLE: ${{ steps.fix.outputs.unfixable }}
      run: |
        set -euo pipefail
        tmp="${RUNNER_TEMP:-/tmp}"
        body="${tmp}/comment-body.md"
        patch="${tmp}/auto-fix.patch"
        git diff > "$patch"
        files="$(git diff --name-only)"
        # A count and a diff must agree. "Fixed one file" over an unchanged tree is a
        # contradiction, not "nothing to do", and the two must never share a path out.
        if [ "${COUNT}" = "0" ] && [ -s "$patch" ]; then
          echo "The fix reported no files, yet the tree changed. Refusing to describe" >&2
          echo "a working tree this step cannot account for." >&2
          exit 1
        fi
        if [ "${COUNT}" != "0" ] && [ ! -s "$patch" ]; then
          echo "The fix reported ${COUNT} file(s) but produced no diff." >&2
          exit 1
        fi
        if [ "${COUNT}" = "0" ]; then
          echo "Nothing to auto-fix — no modified file is missing its notice." > "$body"
        else
          {
            echo "**Nothing has been pushed. This is a patch for you to apply yourself.**"
            echo
            echo "The modification notice is missing from ${COUNT} file(s):"
            echo
            printf '%s\n' "$files" | sed 's|^|- `|; s|$|`|'
            echo
          } > "$body"
          # A comment body is capped at 65536 characters. A patch cut off at the cap
          # still applies cleanly up to the cut, so the author lands a partial fix
          # that looks complete. Say it is too large instead.
          if [ "$(wc -c < "$patch")" -gt 60000 ]; then
            {
              echo "The patch is too large to post here. Add the notice to the files"
              echo "listed above by hand, or re-run the fix locally; the gate clears"
              echo "once the notice is there."
            } >> "$body"
          else
            {
              echo "Save the block below as \`auto-fix.patch\`, then run"
              echo "\`git apply auto-fix.patch\`, commit, and push to this branch."
              echo
              echo '```diff'
              cat "$patch"
              echo '```'
            } >> "$body"
          fi
          {
            echo
            echo "Nothing existing was altered: each notice is appended to a header"
            echo "block that is already there. New files and altered licence lines are"
            echo "**not** auto-fixed; those need a person."
            echo
            echo "This workflow does not push. A push from it would make the bot the"
            echo "last pusher on your branch, which lets whoever pushed here last"
            echo "approve their own commit, and moving the head dismisses reviews you"
            echo "have already been given. Applying it yourself keeps both intact."
          } >> "$body"
        fi
        if [ -n "${UNFIXABLE:-}" ] && [ "${UNFIXABLE}" != "0" ]; then
          {
            echo
            echo "**${UNFIXABLE} file(s) could not be fixed automatically** — see the"
            echo "run log. Add the notice by hand; the gate will clear once it is there."
          } >> "$body"
        fi

    - name: Report
      if: steps.auth.outputs.ok == 'true'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs');
          const {owner, repo} = context.repo;
          const path = `${process.env.RUNNER_TEMP || '/tmp'}/comment-body.md`;
          if (!fs.existsSync(path)) {
            // No body means the previous step did not complete. Saying anything about
            // the tree here would be a statement nothing has earned.
            core.setFailed('auto-fix did not complete; no patch was produced');
            return;
          }
          await github.rest.issues.createComment({owner, repo,
            issue_number: context.issue.number,
            body: fs.readFileSync(path, 'utf8')});
