name: Licence gate
description: >-
  Check a pull request's diff for removed licence lines, missing modification
  notices, new files needing a licence decision, and candidate replacement events.

# WHY THIS IS AN ACTION AND NOT A SCRIPT IN THE CONSUMING REPOSITORY
#
# The gate must not be editable by the thing it is gating. When the checks lived in
# the consumer's own `scripts/` directory, the workflow checked out the pull request
# and ran the gate from that checkout - so a pull request could edit the gate to
# report nothing and exit zero, and the gate would pass itself. No permissions and
# no cleverness required; just change the file you are being judged by.
#
# Consumed as an action pinned to a commit SHA, the code that runs is fixed at the
# pin. The pull request's *content* is read freely - that is the input. Its *code*
# is never executed.
#
# The pin must be a SHA. Pinned to a branch or a tag, a single push here changes the
# gate everywhere at once, and this repository becomes the most security-critical
# thing in the estate. Pinned to a SHA, a push here reaches nobody until someone
# bumps the pin, and that bump is a reviewed pull request in the consuming repo.

inputs:
  token:
    description: Token used to post the review comment.
    required: true
  base-sha:
    description: Base commit of the pull request.
    required: true
  head-sha:
    description: Head commit of the pull request.
    required: true
  author:
    description: >-
      Login of the pull request's author. Used so the report can say who is barred
      from signing off rather than leaving the reader to discover it.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # WHY THE INPUTS ARE VERIFIED AGAINST THE EVENT
    #
    # The note above says the gate must not be editable by the thing it is gating,
    # and then took the commits it compares from the caller. On a `pull_request`
    # event the workflow file that runs is the pull request's own copy of it, so the
    # pull request chose those commits. Passing `head.sha` as `base-sha` makes the
    # diff `head..head`, which is empty: no findings, exit zero, required check green.
    # No permissions needed, and the edit itself is invisible because `.github/` is
    # ignored by the gate.
    #
    # The event payload is written by GitHub and cannot be set by the branch, so it
    # is the only trustworthy statement of what this pull request actually is. The
    # inputs stay - a consumer passing the wrong thing should be told, not silently
    # overridden - but they are now checked rather than believed.
    #
    # Refusing any other event is deliberate. There is no payload to check against,
    # so an unrecognised trigger is an unverifiable one, and unverifiable fails.
    - name: Verify the inputs against the event
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_BASE: ${{ inputs.base-sha }}
        INPUT_HEAD: ${{ inputs.head-sha }}
        INPUT_AUTHOR: ${{ inputs.author }}
        EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
      run: |
        set -euo pipefail

        fail() {
          echo "::error title=Licence gate refused to run::$1"
          echo "The gate compares two commits. It will not accept them from a file"
          echo "the pull request can edit. Fix the caller workflow, or if you did not"
          echo "write it, report this - it is what a bypass attempt looks like."
          exit 1
        }

        case "$EVENT_NAME" in
          pull_request|pull_request_target) ;;
          *) fail "event '$EVENT_NAME' carries no pull request to verify against; this action runs on pull_request only" ;;
        esac

        [ -n "$EVENT_BASE" ] || fail "the event payload has no base commit"
        [ -n "$EVENT_HEAD" ] || fail "the event payload has no head commit"

        [ "$INPUT_BASE" = "$EVENT_BASE" ] || fail "base-sha is '$INPUT_BASE'; the event says '$EVENT_BASE'"
        [ "$INPUT_HEAD" = "$EVENT_HEAD" ] || fail "head-sha is '$INPUT_HEAD'; the event says '$EVENT_HEAD'"

        # The author only decides whose name the report prints as barred from signing
        # off. Wrong, it points the reader at the wrong person, so it is checked too.
        if [ -n "$INPUT_AUTHOR" ] && [ "$INPUT_AUTHOR" != "$EVENT_AUTHOR" ]; then
          fail "author is '$INPUT_AUTHOR'; the event says '$EVENT_AUTHOR'"
        fi

    - name: Run the gate
      id: gate
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        AUTHOR: ${{ inputs.author }}
      run: |
        set +e
        report="${RUNNER_TEMP:-/tmp}/licence-gate-report.md"
        python3 "${GITHUB_ACTION_PATH}/../../scripts/licence-gate.py" \
          --author="$AUTHOR" "$BASE_SHA" "$HEAD_SHA" > "$report"
        echo "exit=$?" >> "$GITHUB_OUTPUT"
        cat "$report"

    - name: Post or update the review comment
      uses: actions/github-script@v7
      env:
        HEAD_SHA: ${{ inputs.head-sha }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs');
          const reportPath =
            `${process.env.RUNNER_TEMP || '/tmp'}/licence-gate-report.md`;
          const marker = '<!-- licence-gate -->';
          const sha = process.env.HEAD_SHA;
          const {owner, repo} = context.repo;

          // NO REPORT IS NOT AN EMPTY REPORT.
          //
          // The step above redirects the gate's stdout to this file and then exits on
          // `cat`, which succeeds whatever the gate did. A missing python3 or a moved
          // script path therefore leaves the file created and EMPTY, and posting it
          // publishes a report with nothing in it - indistinguishable from a report
          // with nothing to say, on a pull request nothing examined. The patch-comment
          // steps already refuse to describe a tree they cannot account for; this is
          // the same refusal.
          if (!fs.existsSync(reportPath)) {
            core.setFailed('The licence gate produced no report file. Nothing was ' +
              'examined, so nothing is being said about this pull request.');
            return;
          }
          const body = fs.readFileSync(reportPath, 'utf8');
          if (!body.trim()) {
            core.setFailed('The licence gate produced an empty report. That is not the ' +
              'same as a clean one - see the run log for what the gate did.');
            return;
          }

          const wrap = (content) => `${marker}\n## Licence gate\n\n${content}\n\n---\n<sub>Evaluated at \`${sha.substring(0,9)}\`. A disposition made against an earlier commit does not carry over.</sub>`;

          // A comment body is capped at 65536 characters; over it the API answers 422,
          // the step throws, and no comment appears at all - on the widest pull
          // requests, which are the ones a reviewer cannot reconstruct by eye. The
          // same 60000 the patch comment budgets to, for the same reason.
          const LIMIT = 60000;
          let text = wrap(body);
          if (text.length > LIMIT) {
            // The full report goes to the step summary FIRST, so the pointer below is
            // a fact rather than a hope.
            await core.summary.addRaw(body).write();
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // Truncating the report here would reproduce exactly the failure the patch
            // comment refuses: a body cut off at the cap reads as complete. So the
            // degraded comment is a DIFFERENT document - the headings, which carry the
            // counts, and the list of what has to happen - and it says what it is.
            const lines = body.split('\n');
            const CAP = 200;
            const take = (re) => {
              const all = lines.filter(l => re.test(l));
              return [all.slice(0, CAP), Math.max(0, all.length - CAP)];
            };
            let [todo, dropped] = take(/^\d+\.\s+\*\*/);
            let [headings, droppedHeadings] = take(/^#{2,4}\s+\S/);
            dropped += droppedHeadings;
            for (;;) {
              const out = [
                `**This report is ${body.length} characters and does not fit in a ` +
                `comment.** Nothing was dropped from the checks - only from this ` +
                `comment. The full report is in the [step summary and run log](${runUrl}).`,
                '',
              ];
              if (todo.length) {
                out.push('### What has to happen before this merges', '', ...todo, '');
              }
              if (headings.length) {
                out.push('### What the full report contains', '',
                         ...headings.map(h => `- ${h.replace(/^#+\s+/, '')}`), '');
              }
              if (dropped) {
                out.push(`_${dropped} further line(s) are in the full report only._`);
              }
              text = wrap(out.join('\n'));
              if (text.length <= LIMIT) break;
              if (headings.length) headings.pop();
              else if (todo.length) todo.pop();
              else break;
              dropped += 1;
            }
          }
          const issue_number = context.issue.number;
          // Paginated, as actions/acknowledgement does it. Unpaginated this returns
          // the first 30 comments, so on any longer discussion the marker is not
          // found and a second report is posted instead of the first being updated -
          // one more per push, on the pull requests whose report matters most.
          const comments = await github.paginate(github.rest.issues.listComments,
            {owner, repo, issue_number, per_page: 100});
          const mine = comments.find(c => c.body && c.body.includes(marker));
          if (mine) {
            await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body: text});
          } else {
            await github.rest.issues.createComment({owner, repo, issue_number, body: text});
          }

    - name: Fail if blocking checks failed
      if: steps.gate.outputs.exit != '0'
      shell: bash
      run: |
        echo "Blocking licence-gate checks failed. See the review comment."
        exit 1
